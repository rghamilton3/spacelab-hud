name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Bump to force a sysroot cache refresh (e.g. after a major Slint upgrade).
  SYSROOT_CACHE_VERSION: v1

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: sudo apt-get install -y libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo check
      - run: cargo clippy -- -D warnings

  build-pi4:
    name: Build Pi 4 (aarch64, glibc 2.35)
    # Validate the cross-compile on PRs and tags, but never on plain main pushes.
    # Artifact upload + GitHub Release happen on tags only (see step-level conditions).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: pi4

      - name: Cache Pi sysroot
        id: sysroot-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pi-sysroot-aarch64
          key: pi4-sysroot-${{ env.SYSROOT_CACHE_VERSION }}-${{ hashFiles('Cargo.toml', 'scripts/setup-pi-sysroot.sh') }}

      - name: Extract Pi sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: scripts/setup-pi-sysroot.sh

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        run: |
          SYSROOT="$HOME/.local/share/pi-sysroot-aarch64"
          PKG_CONFIG_SYSROOT_DIR="$SYSROOT" \
          PKG_CONFIG_LIBDIR="$SYSROOT/usr/lib/aarch64-linux-gnu/pkgconfig:$SYSROOT/usr/share/pkgconfig" \
          PKG_CONFIG_ALLOW_CROSS=1 \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-L $SYSROOT/usr/lib/aarch64-linux-gnu" \
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.35

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: spacelab-hub-pi4
          path: target/aarch64-unknown-linux-gnu/release/spacelab-hub
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/aarch64-unknown-linux-gnu/release/spacelab-hub
          generate_release_notes: true
